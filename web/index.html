<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff8a1e">
<title>메할일</title>
<script src="config.js"></script><script src="vendor/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 게임 속 퀘스트 알리미처럼 경쾌하지만, 매일 쓰는 도구라 정돈되고 빠르게
   IDEA: 메이플 퀘스트 로그 — 단풍 주황 띠(탭이 달린 창) 아래 체크하는 숙제 목록
   PICTURE: 오늘의 일간·주간·월간 체크리스트 자체, 위에는 리셋 카운트다운과 캐릭터 칩
   COLOUR and TYPE: 흰 바탕 + 단풍 주황 띠 + 하늘색 진행 막대 / Jua 제목 + Noto Sans KR 본문
   LAYOUT: 띠(제목·리셋·캐릭터·탭) → 3열 체크리스트 → 진행 중 이벤트, 900px 이하 1열 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#15100c);--ink:light-dark(#2a1c10,#f6ece2);--mute:light-dark(#806b5a,#b4a291);
--line:light-dark(#f0e5da,#33281f);--card:light-dark(#ffffff,#1e1712);--soft:light-dark(#fff3e6,#2a2017);
--or:light-dark(#ff8a1e,#ff9a3c);--sky:light-dark(#1d9bf0,#5cbcff);--band:light-dark(#ff8a1e,#3b2413);--bandink:light-dark(#2a1203,#ffe3c6);
--chip:light-dark(rgb(255 255 255/.38),rgb(255 255 255/.07));--pink:light-dark(#e2406f,#ff7aa0)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{word-break:keep-all;overflow-wrap:break-word;margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.tabs a,.dday,.cnt,.mh{font-family:Jua,'Noto Sans KR',sans-serif;font-weight:400;margin:0}
.wrap{max-width:1240px;margin:0 auto}
.band{background:var(--band);color:var(--bandink);padding:22px max(4vw,16px) 0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top svg{width:44px;height:44px;flex:none}
h1{font-size:46px;line-height:1.05}
.date{font-size:17px;font-weight:500}
#sync{margin-left:auto;font-size:13px;opacity:.85}
.resets{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 12px}
.rs{background:var(--chip);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.rs b{font-weight:700}
.chwrap{position:relative;margin-bottom:14px}
.chars{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scroll-behavior:smooth;scrollbar-width:none;-ms-overflow-style:none}
.chars::-webkit-scrollbar{display:none}
.chwrap.sl .chars{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 56px);mask-image:linear-gradient(90deg,transparent 0,#000 56px)}
.chwrap.sr .chars{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent)}
.chwrap.sl.sr .chars{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 56px,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 56px,#000 calc(100% - 56px),transparent)}
.chnav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;box-shadow:0 3px 10px rgb(0 0 0/.18);display:none;align-items:center;justify-content:center;padding-bottom:3px}
.chnav.l{left:-6px}.chnav.r{right:-6px}.chwrap.sl .chnav.l,.chwrap.sr .chnav.r{display:flex}.chnav:hover{background:var(--soft)}
.chip form input{width:150px}
.chx{margin-left:2px;min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;font-size:13px;font-weight:700;opacity:.55;background:rgba(127,127,127,.18)}.chx.on{padding:0 10px;opacity:1;background:#e5484d;color:#fff}
.chip{min-height:68px;border:0;border-radius:18px;padding:8px 20px 8px 12px;font-size:18px!important;background:var(--chip);color:inherit;font:inherit;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer;flex:none}
.chip small{font-size:13px;font-weight:500;opacity:.8;white-space:nowrap}
.chip .cn{white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;font-weight:700}
.chip.on{background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgb(0 0 0/.18)}
.chip form{display:flex;gap:6px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs a{flex:none;padding:12px 20px;border-radius:16px 16px 0 0;color:inherit;text-decoration:none;font-size:19px}
.tabs a.on{background:var(--bg);color:var(--ink)}
main{padding:clamp(20px,3vw,40px) max(4vw,16px) 56px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.blk,.ev,.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
h2{font-size:26px;line-height:1.1}h3{font-size:21px;line-height:1.2}
.cnt{font-size:22px;color:var(--sky)}
.rl{font-size:13px;color:var(--mute);margin:6px 0 0}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sky);border-radius:inherit;transition:width .35s}
.list{list-style:none;margin:10px 0 12px;padding:0}
.task{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.ck{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-height:46px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:6px 2px}
.box{width:23px;height:23px;border:2px solid var(--mute);border-radius:7px;flex:none;display:grid;place-items:center;transition:transform .15s}
.done .box{background:var(--or);border-color:var(--or)}
.done .box::after{content:'';width:10px;height:5px;border:solid #fff;border-width:0 0 3px 3px;transform:translateY(-2px) rotate(-45deg)}
.ck:active .box{transform:scale(.88)}
.done .tl{color:var(--mute);text-decoration:line-through}
.tl{min-width:min-content;flex:0 1 auto}
.ck.two{flex-wrap:nowrap;padding:8px 2px}.tw{display:flex;flex-direction:column;gap:1px;min-width:0}.tag2{font-size:13px;color:var(--mute);white-space:nowrap}
.tag{margin-left:auto;font-size:13px;color:var(--mute);white-space:nowrap;padding-left:8px;text-align:right}
.empty{color:var(--mute);font-size:14px;padding:12px 0}
input,select,textarea{font:inherit;font-size:16px;min-height:44px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0 12px}
textarea{width:100%;min-height:90px;padding:10px 12px}
button{font:inherit}
.btn{min-height:44px;border:0;border-radius:12px;padding:0 16px;background:var(--or);color:#2a1203;font-weight:700;cursor:pointer;white-space:nowrap}

.btn.warn{background:var(--pink);color:#fff}
.x{min-width:44px;min-height:44px;border:0;background:none;color:var(--mute);cursor:pointer;border-radius:10px;font-size:18px}
.x:hover{background:var(--soft)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.qa{display:flex;gap:6px;flex-wrap:wrap}.qa input{flex:1 1 140px}
.sec{margin-top:36px}
.sh{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sh p{margin:0;color:var(--mute);font-size:14px}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:18px}
.evh{display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.dday{margin-left:auto;font-size:15px;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--sky);color:#fff}
.dday.soon{background:var(--pink)}.dday.up,.dday.end{background:var(--soft);color:var(--mute)}
.per{margin:4px 0 10px;color:var(--mute);font-size:14px;white-space:nowrap}
.memo{margin:0 0 10px;font-size:14px;background:var(--soft);border-radius:10px;padding:8px 12px;white-space:pre-wrap}
.evp{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ef{display:grid;gap:10px;margin-top:10px}
.ef label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.ef .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.sw{display:flex;gap:8px}.sw label{display:block}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:block;width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid transparent;cursor:pointer}
.sw input:checked+span{border-color:var(--ink)}.sw input:focus-visible+span{outline:3px solid var(--sky)}
details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;list-style:none}
details>summary::before{content:'＋';margin-right:8px;color:var(--or)}
details[open]>summary::before{content:'－'}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mh{font-size:30px;margin-right:auto}
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wk span{text-align:center;font-size:13px;color:var(--mute);padding-bottom:4px}
.wk span:first-child{color:var(--pink)}.wk span:last-child{color:var(--sky)}
.day{min-height:100px;display:flex;flex-direction:column;gap:3px;text-align:left;padding:6px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:inherit;cursor:pointer;overflow:hidden}
.day.out{opacity:.38}.day.today{border-color:var(--or)}.day.sel{background:var(--soft)}
.dn{font-weight:700;font-size:14px}
.eb{display:block;height:17px;background:var(--c);color:#1a0f05;border-radius:5px;font-size:12px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:17px}
.more{font-size:12px;color:var(--mute)}
.dp{margin-top:auto;height:6px;background:var(--soft);border-radius:9px;overflow:hidden}.dp i{display:block;height:100%;background:var(--sky)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:10px}
.leg i{display:inline-block;width:22px;height:6px;border-radius:9px;background:var(--sky);vertical-align:middle;margin-right:6px}
.st{width:100%;border-collapse:collapse}.st td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.st td:last-child{text-align:right;white-space:nowrap}
.trow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.trow2{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.trow2 .r1{display:flex;gap:8px;align-items:center}.trow2 .r1 .tn{flex:1 1 auto}.trow2 .r1 .tc{flex:0 0 110px}
.trow2 .r2{display:flex;gap:8px;align-items:flex-end;justify-content:space-between}.trow2 .chs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.trow2 .del{flex:none;min-height:40px}
.trow .tn{flex:2 1 180px}.trow .tc{flex:1 1 90px;max-width:140px}
.mini{min-height:36px;border:2px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:0 12px;white-space:nowrap;cursor:pointer;font-size:14px}
.mini.on{border-color:var(--sky);color:var(--sky);font-weight:700}
.note{font-size:13px;color:var(--mute);margin:14px 0 0}
.prof{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.3fr);gap:22px;align-items:center;margin-bottom:20px}
.prof0{margin-bottom:20px}.prof0 a{color:var(--sky)}
.ava{width:168px;height:168px;border-radius:18px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.ava img{width:168px;height:168px;image-rendering:auto}
.pm{color:var(--mute);font-size:14px;margin:2px 0 8px}
.lv{font-family:Jua,'Noto Sans KR',sans-serif;font-size:40px;line-height:1;color:var(--or);white-space:nowrap}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:12px}
.kv b{display:block;font-size:17px;color:var(--ink);white-space:nowrap}
.fig{position:relative;min-height:150px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chip img.face{width:52px;height:52px;border-radius:50%;image-rendering:auto;background:rgb(255 255 255/.55);margin:-6px 0}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;cursor:pointer;margin-top:6px}
.chk input{width:20px;height:20px;min-height:0;accent-color:var(--or)}
.rs.inst{border:0;font:inherit;font-size:14px;font-weight:700;color:inherit;cursor:pointer;background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
.cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.brow{display:flex;align-items:center;gap:8px 12px;padding:8px 4px 8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brow .sm{flex:none;width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;padding:0}
.bn{flex:1 0 auto;min-width:max-content;white-space:nowrap;font-weight:500}.bn.off{color:var(--mute);font-weight:400}.brow.done .bn{text-decoration:line-through;color:var(--mute)}
.pty{min-height:36px;padding:0 6px;font-size:14px}.bpr{font-size:13px;color:var(--mute);white-space:nowrap;min-width:64px;text-align:right}
.pin{width:130px;min-height:36px;text-align:right}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin-left:auto}.cnt.warn{color:var(--pink)}
.bossonly .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));column-gap:24px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wd{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;min-height:170px;display:flex;flex-direction:column;gap:5px}
.wd.today{border-color:var(--or)}.wd.past{opacity:.7}
.wdh{display:flex;align-items:baseline;gap:6px;margin-bottom:2px}.wdn{font-family:Jua,sans-serif;font-size:18px}.wd.today .wdn{color:var(--or)}.wdd{font-size:13px;color:var(--mute)}
.wev{height:auto;white-space:normal;line-height:1.35;padding:2px 6px;font-size:12px}
.wclr{font-size:12px;font-weight:700;color:var(--sky)}
.wpl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.wpl li{display:flex;align-items:flex-start;gap:4px}
.pck{flex:none;background:none;border:0;padding:4px 0;cursor:pointer;color:inherit}.pck .box{width:18px;height:18px;border-radius:5px}
.wpl li.done .box{background:var(--or);border-color:var(--or)}.wpl li.done .box::after{content:'';width:8px;height:4px;border:solid #fff;border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.ptx{flex:1;background:none;border:0;padding:3px 2px;font:inherit;font-size:14px;color:inherit;text-align:left;cursor:pointer;border-radius:6px;line-height:1.35}.ptx:hover{background:var(--soft)}
.wpl li.done .ptx{text-decoration:line-through;color:var(--mute)}
.padd{margin-top:auto;align-self:stretch;min-height:36px;border:2px dashed var(--line);border-radius:10px;background:none;color:var(--mute);font-size:18px;cursor:pointer}.padd:hover{border-color:var(--or);color:var(--or)}
.mpl{display:block;font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}.mpl.done{text-decoration:line-through;color:var(--mute)}
.mplan{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}.mplan .padd{margin-top:4px}

.pf,.pf2{display:grid;gap:6px}.pf input,.pf2 input{min-height:38px;font-size:15px;padding:0 8px;width:100%}.pf .btn,.pf2 .btn{min-height:36px;padding:0 10px;font-size:14px}

.inc{font-family:Jua,'Noto Sans KR',sans-serif;font-size:22px;color:var(--or);white-space:nowrap;text-align:right;line-height:1.15}.inc.big{font-size:32px}.inc.big small{font-size:13px}
.inc small{display:block;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--mute)}
.bst tr.tot td{border-bottom:0;border-top:2px solid var(--line);padding-top:10px;font-weight:700;font-size:16px;color:var(--or)}.bst tr.tot td .rl{font-weight:400}
.arow{padding:12px 0;border-bottom:1px solid var(--line)}.ah{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
img.face.sm{width:36px;height:36px;border-radius:50%;background:var(--soft)}
.achips{display:flex;flex-wrap:wrap;gap:6px}
.achip{min-height:38px;border:2px solid var(--sky);background:var(--card);color:var(--ink);border-radius:99px;padding:0 12px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.achip small{color:var(--mute);font-weight:400}.achip.done{border-color:var(--line);background:var(--soft);color:var(--mute);text-decoration:line-through}
.lsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:6px 0 18px}

.pos{color:var(--sky)}.neg{color:var(--pink)}
.lday{margin-top:14px}.ldh{display:flex;justify-content:space-between;font-weight:700;font-size:14px;padding-bottom:4px;border-bottom:2px solid var(--line)}.ldh span{color:var(--mute);font-weight:500}
.lrow{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 4px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}

.lc{flex:1;min-width:0}.lc small{color:var(--mute)}.lrow b{white-space:nowrap}

.seg2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mnet{font-size:11px;font-weight:700;white-space:nowrap}
@media(max-width:600px){.mnet{font-size:10px}}
.clrp{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);white-space:nowrap}.clrp input{min-height:38px;font-size:15px;padding:0 8px}
.lmv{background:var(--soft);border-radius:10px;padding:6px 10px;margin:4px 0}.lmvr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px;flex-wrap:wrap}.lmvr input{min-height:36px;font-size:14px;padding:0 6px}
.x.sm3{min-width:28px;min-height:28px;font-size:14px;padding:0 4px;vertical-align:middle}
.psw{display:flex;gap:6px;flex-wrap:wrap}.psw label{display:block;cursor:pointer}.psw input{position:absolute;opacity:0;pointer-events:none}

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const KST=9*3600e3;
const kst=()=>new Date(Date.now()+KST);
const ymd=d=>d.toISOString().slice(0,10);
const today=()=>ymd(kst());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return ymd(d)};
const dow=s=>new Date(s+'T00:00:00Z').getUTCDay();
const lastDow=(s,w)=>addDays(s,-((dow(s)-w+7)%7));
const diff=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const WD='일월화수목금토';
const fmtD=s=>`${+s.slice(5,7)}.${+s.slice(8)}`;
const P={d:'일간',w:'주간',m:'월간'};
const COLORS=['#ffb066','#7cc7ff','#ff8fb3','#6fdcb4','#b9a2ff'];
const col=c=>COLORS.includes(c)?c:COLORS[0];

function curKeys(){const s=today();return{d:'d:'+s,mon:'wm:'+lastDow(s,1),thu:'wt:'+lastDow(s,4),m:'m:'+s.slice(0,7)}}
function keyOf(t){const k=curKeys();return t.period==='d'?k.d:t.period==='m'?k.m:k.thu}
function msTo(kind){const n=kst(),s=ymd(n);let t;
  if(kind==='d')t=addDays(s,1);else if(kind==='mon')t=addDays(lastDow(s,1),7);else if(kind==='thu')t=addDays(lastDow(s,4),7);
  else{const y=+s.slice(0,4),m=+s.slice(5,7);t=m===12?`${y+1}-01-01`:`${y}-${String(m+1).padStart(2,'0')}-01`}
  return new Date(t+'T00:00:00Z')-n}
function left(ms){const m=Math.max(0,Math.floor(ms/6e4)),d=Math.floor(m/1440),h=Math.floor(m%1440/60);return d?`${d}일 ${h}시간`:`${h}시간 ${m%60}분`}

function seed(){const t=today();return{v:1,sample:true,cur:null,chars:[],
  tasks:[['아케인리버 일일 퀘스트','d','퀘스트'],['그란디스 일일 퀘스트','d','퀘스트'],['몬스터파크','d','사냥'],['일간 보스','d','보스'],['데일리 기프트 수령','d','기타'],
    ['무릉도장','w','컨텐츠','thu'],['에픽 던전','w','컨텐츠','thu'],['길드 주간 미션','w','길드','thu'],['검은 마법사','m','보스']]
    .map(([name,period,cat,reset])=>({id:uid(),name,period,cat,reset:reset||'thu',chars:[],all:true})),
  checks:{},evChecks:{},hist:{},grow:{},bsel:{},customBoss:[],bossV:1,
  events:[{id:uid(),name:'겨울 이벤트 (예시)',start:addDays(t,-5),end:addDays(t,36),color:COLORS[1],memo:'예시 이벤트예요. 수정하거나 지워도 돼요.',
    tasks:[{id:uid(),name:'이벤트 일일 미션',type:'daily'},{id:uid(),name:'코인샵 교환',type:'once'},{id:uid(),name:'패스 보상 수령',type:'once'}]}]}}
function norm(s){if(!s||!Array.isArray(s.chars))return seed();
  {const n=s.chars.length;s.chars=s.chars.filter(c=>!(c.name==='본캐'&&!c.info&&!(s.grow&&s.grow[c.id])&&!(s.bsel&&s.bsel[c.id]&&Object.keys(s.bsel[c.id]).length)));if(s.chars.length!==n&&!s.chars.some(c=>c.id===s.cur))s.cur=s.chars[0]?s.chars[0].id:null}
  for(const k of['tasks','events'])if(!Array.isArray(s[k]))s[k]=[];
  for(const k of['checks','evChecks','hist','grow'])if(!s[k]||typeof s[k]!=='object')s[k]={};
  for(const t of s.tasks){if(!Array.isArray(t.chars))t.chars=[];if(t.all===undefined)t.all=!t.chars.length}
  for(const e of s.ledger||[])if(e.kind==='cash'){e.cat={'넥슨캐시':'넥슨캐시 충전','메이플포인트':'넥슨캐시 충전','메이플포인트 충전':'넥슨캐시 충전','패스':'기타 결제','패키지':'기타 결제','기타':'기타 결제'}[e.cat]||e.cat}
  if(!s.bsel||typeof s.bsel!=='object')s.bsel={};if(!Array.isArray(s.customBoss))s.customBoss=[];
  if(!s.bossV){s.tasks=s.tasks.filter(t=>!(t.period==='w'&&t.name==='주간 보스'));s.bossV=1}
  if(!s.chars.some(c=>c.id===s.cur))s.cur=s.chars[0].id;return s}
function prune(){const keep=new Set(Object.values(curKeys()));for(const k in S.checks)if(!keep.has(k))delete S.checks[k];
  const t=today(),ev=new Set(S.events.map(e=>e.id));
  for(const k in S.evChecks){const p=k.split(':');if(!ev.has(p[0])||(p[3]!=='once'&&p[3]!==t))delete S.evChecks[k]}
  const cut=addDays(t,-400);for(const d in S.hist)if(d<cut)delete S.hist[d];
  for(const c in S.grow)for(const d in S.grow[c])if(d<cut)delete S.grow[c][d];
  for(const d in (S.plans||{}))if(d<cut)delete S.plans[d];
  for(const d in (S.bossInc||{}))if(d<addDays(t,-800))delete S.bossInc[d];
  S.events=S.events.filter(e=>!(e.src==='nexon'&&!e.tasks.length&&e.end<addDays(t,-60)))}

let S;try{S=norm(JSON.parse(localStorage.getItem('meharil')))}catch(e){S=seed()}
prune();
const ui={tab:'today',month:today().slice(0,7),sel:today(),edit:null,addChar:false,confirm:null};

const applies=(t,c)=>t.all!==false?true:t.chars.includes(c);
const isDone=(t,c)=>!!S.checks[keyOf(t)]?.[c+':'+t.id];
const evKey=(e,t,c)=>`${e.id}:${t.id}:${c}:${t.type==='daily'?today():'once'}`;
const evDone=(e,t,c=S.cur)=>!!S.evChecks[evKey(e,t,c)];
function stat(p,c){const ts=S.tasks.filter(t=>t.period===p&&applies(t,c));return[ts.filter(t=>isDone(t,c)).length,ts.length]}
const pct=([a,b])=>b?Math.round(a/b*100):0;
function recordHist(){const t=today();S.hist[t]={};for(const c of S.chars)S.hist[t][c.id]=stat('d',c.id)}
function evStatus(e){const t=today();if(t<e.start)return{k:'up',l:`${diff(t,e.start)}일 뒤 시작`};if(t>e.end)return{k:'end',l:'종료'};
  const n=diff(t,e.end);return{k:n<=3?'soon':'on',l:n?`D-${n}`:'오늘 종료'}}

/* ---------- character info (Nexon import) ---------- */
let imgs={};try{imgs=JSON.parse(localStorage.getItem('meharil-img'))||{}}catch(e){}
const okImg=s=>typeof s==='string'&&s.length<300000&&/^data:image\/(png|gif|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(s);
const fmtPow=v=>{const n=Math.floor(+v);if(!n)return'-';const f=x=>x.toLocaleString('ko-KR');
  if(n>=1e8)return`${f(Math.floor(n/1e8))}억 ${f(Math.floor(n%1e8/1e4))}만`;if(n>=1e4)return`${f(Math.floor(n/1e4))}만`;return f(n)};
const fmtAt=s=>{const d=new Date(Date.parse(s)+KST);return isNaN(d)?'':`${d.getUTCMonth()+1}.${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`};
const crops={};
function cropImg(cid){const src=imgs[cid];if(!okImg(src))return null;const k=crops[cid];if(k&&k.src===src)return k;
  crops[cid]={src};const im=new Image();

      power:String(r.power||'').replace(/\D/g,'').slice(0,15),union:String(r.union||'').replace(/\D/g,'').slice(0,5),at};
    if(Array.isArray(r.symbols)&&r.symbols.length)c.symbols=r.symbols.slice(0,30).map(x=>({n:String(x&&x.n||'').slice(0,40),lv:Math.floor(cl(x.lv,0,99)),f:Math.floor(cl(x.f,0,99999)),g:Math.floor(cl(x.g,0,99999)),r:Math.floor(cl(x.r,0,99999))}));

let saving=false,dirty=false,timer=null;

function save(){S.t=Date.now();try{localStorage.setItem('meharil',JSON.stringify(S))}catch(e){}
  dirty=true;clearTimeout(timer);timer=setTimeout(flush,800);if(session)setSync('저장 중…')}
async function flush(){if(!session||!sb){dirty=false;return}if(saving){timer=setTimeout(flush,500);return}
  saving=true;const t=S.t,row={user_id:session.user.id,s:S,t,updated_at:new Date().toISOString()};if(imgsDirty)row.imgs=imgs;
  let error=null;try{({error}=await sb.from('meharil_state').upsert(row,{onConflict:'user_id'}))}catch(e){error=e}
  saving=false;if(error){setSync('저장 실패 · 기기에는 저장됨');timer=setTimeout(flush,15000);return}
  if(row.imgs)imgsDirty=false;if(S.t===t){dirty=false;setSync('저장됨 · 모든 기기 동기화')}}
async function pull(){if(!session||!sb||dirty||saving)return;
  let data=null,error=null;try{({data,error}=await sb.from('meharil_state').select('s,imgs,t').eq('user_id',session.user.id).maybeSingle())}catch(e){error=e}
  if(error){setSync('동기화 실패 · 기기에 저장 중');return}
  if(!data){if(S.t){imgsDirty=true;save()}else setSync('저장됨 · 모든 기기 동기화');return}
  let ch=false;
  if((data.t||0)>(S.t||0)){S=norm(data.s);S.t=data.t;prune();backfillBoss();lsSet('meharil',JSON.stringify(S));ch=true}
  else if((S.t||0)>(data.t||0))save();
  if(data.imgs&&typeof data.imgs==='object'){for(const k in data.imgs)if(okImg(data.imgs[k])&&imgs[k]!==data.imgs[k]){imgs[k]=data.imgs[k];ch=true}lsSet('meharil-img',JSON.stringify(imgs))}

  if(f.dataset.fid){const F=(S.evFolders||[]).find(x=>x.id===f.dataset.fid);if(F&&n)F.name=n.slice(0,30);ui.fedit=null;return change()}
  if(f.id==='qledform'){const kind=fd.get('kind')==='cash'?'cash':'meso',type=kind==='cash'?'out':(fd.get('type')==='in'?'in':'out'),date=f.dataset.date,amt=kind==='cash'?Math.round(+String(fd.get('amt')).replace(/[^\d]/g,'')):parseAmt(fd.get('amt'));
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!amt)return;const cat=LCAT[kind][type].includes(String(fd.get('cat')))?String(fd.get('cat')):LCAT[kind][type].slice(-1)[0];
    const cid=S.chars.some(c=>c.id===fd.get('cid'))?String(fd.get('cid')):'';ui.lcid=cid;S.ledger=S.ledger||[];S.ledger.push({id:uid(),kind,type,date,amt,cat,cid,memo:String(fd.get('memo')||'').trim().slice(0,60)});return change()}
  if(f.id==='ledform'){const kind=fd.get('kind')==='cash'?'cash':'meso',type=kind==='cash'?'out':(fd.get('type')==='in'?'in':'out'),date=String(fd.get('date')),amt=kind==='cash'?Math.round(+String(fd.get('amt')).replace(/[^\d]/g,'')):parseAmt(fd.get('amt'));
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!amt)return;const cat=LCAT[kind][type].includes(String(fd.get('cat')))?String(fd.get('cat')):LCAT[kind][type].slice(-1)[0],memo=String(fd.get('memo')||'').trim().slice(0,60);
    const cid=S.chars.some(c=>c.id===fd.get('cid'))?String(fd.get('cid')):'';ui.lcid=cid;S.ledger=S.ledger||[];const E=ui.ledEdit&&S.ledger.find(e=>e.id===ui.ledEdit);if(E)Object.assign(E,{kind,type,date,amt,cat,cid,memo});else S.ledger.push({id:uid(),kind,type,date,amt,cat,cid,memo});
    ui.ledEdit=null;ui.ldate=null;ui.lmonth=date.slice(0,7);return change()}
  if(f.id==='balform'){const amt=parseAmt(fd.get('amt'));if(!amt)return;S.mesoBal=(S.mesoBal||[]).filter(b=>b.date!==today());S.mesoBal.push({date:today(),amt});S.mesoBal=S.mesoBal.slice(-200);return change()}
  if(f.id==='bossform'){if(!n)return;const ds=String(fd.get('d')||'').split(/[,\s]+/).map(x=>x.trim().slice(0,8)).filter(Boolean).slice(0,6);
    S.customBoss.push({id:'c'+uid(),name:n.slice(0,20),diffs:ds.length?ds:['노멀']});return change()}
  if(f.id==='authform'){const em=String(fd.get('em')||'').trim(),pw=String(fd.get('pw')||''),up=(e.submitter&&e.submitter.value)==='up',msg=$('#authmsg');
    msg.textContent=up?'가입하는 중…':'로그인하는 중…';
    try{const r=up?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});
      if(r.error)throw r.error;if(up&&!r.data.session)msg.textContent='확인 메일을 보냈어요. 메일의 링크를 누른 뒤 여기서 로그인하세요.';}
    catch(err){const m=String(err.message||err);msg.textContent=/Invalid login/i.test(m)?'이메일이나 비밀번호가 맞지 않아요.':/already registered/i.test(m)?'이미 가입된 이메일이에요. 로그인을 눌러 주세요.':/not confirmed/i.test(m)?'메일 인증이 아직 안 됐어요. 받은 메일의 링크를 눌러 주세요.':/after (\d+) seconds/i.test(m)?`보안 때문에 ${m.match(/after (\d+) seconds/i)[1]}초 뒤에 다시 눌러 주세요.`:/rate limit/i.test(m)?'요청이 너무 많아요. 잠시 뒤에 다시 해 주세요.':'실패: '+m}
    return}
  if(f.id==='charform'){if(!n)return;const c={id:uid(),name:n};S.chars.push(c);S.cur=c.id;ui.addChar=false;return change()}
  if(f.dataset.p){if(!n)return;S.tasks.push({id:uid(),name:n,period:f.dataset.p,cat:'',reset:String(fd.get('r')||'thu'),chars:[],all:true});S.sample=false;return change()}
  if(f.dataset.ev!==undefined){const E=ev(f.dataset.ev);if(!E||!n)return;E.tasks.push({id:uid(),name:n,type:fd.get('ty')==='once'?'once':'daily'});return change()}
  if(f.classList.contains('ef')){let s=String(fd.get('start')),en=String(fd.get('end'));const re=/^\d{4}-\d{2}-\d{2}$/;if(!re.test(s)||!re.test(en))return;if(en<s)[s,en]=[en,s];
    const d={name:String(fd.get('name')).trim()||'이름 없는 이벤트',start:s,end:en,color:col(String(fd.get('color'))),memo:String(fd.get('memo')||'').trim()};
    if(f.dataset.eid){Object.assign(ev(f.dataset.eid)||{},d);ui.edit=null}else S.events.push({id:uid(),...d,tasks:[]});S.sample=false;return change()}
});

document.addEventListener('change',async e=>{const i=e.target;
  if(i.id==='autosync'){lsSet('meharil-autosync',i.checked?null:'0');return}
  if(i.id==='impfile'){const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp').value=String(r.result||'');document.querySelector('[data-act=imp]').click()};r.readAsText(f);return}
  if(i.dataset.bp){const c=S.cur;S.bparty=S.bparty||{};S.bparty[c]=S.bparty[c]||{};const n=+i.value;if(n>1)S.bparty[c][i.dataset.bp]=n;else delete S.bparty[c][i.dataset.bp];return change()}
  if(i.dataset.bpr){S.bprice=S.bprice||{};const v=i.value.replace(/[^\d]/g,'');if(v)S.bprice[i.dataset.bpr]=+v;else delete S.bprice[i.dataset.bpr];return change()}
  if(i.dataset.evf){const E=ev(i.dataset.evf);if(E){if(i.value)E.folder=i.value;else delete E.folder}return change()}
  if(i.id==='clrdate'){ui.clrDate=i.value||null;return render()}
  if(i.dataset.mv){const to=i.value;if(/^\d{4}-\d{2}-\d{2}$/.test(to)){moveClear(i.dataset.mv,i.dataset.from,to);ui.lboss=to;ui.lmonth=to.slice(0,7);return change()}return}
  if(i.dataset.tf){const t=task(i.dataset.id);if(!t)return;const v=i.value.trim();if(i.dataset.tf==='name'&&!v){i.value=t.name;return}t[i.dataset.tf]=v;S.sample=false;return change()}
  if(i.dataset.ch){const c=S.chars.find(x=>x.id===i.dataset.id);const v=i.value.trim();if(!c||!v){render();return}c.name=v;return change()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.addChar){ui.addChar=false;head()}if(ui.planAdd||ui.planEdit){ui.planAdd=ui.planEdit=null;render()}if(ui.dayModal){ui.dayModal=null;render()}}});

function route(){const h=location.hash.slice(1);ui.tab=['today','boss','calendar','ledger','events','setup'].includes(h)?h:'today';render()}
window.addEventListener('hashchange',route);
{const c=$('#chars');c.addEventListener('scroll',chNav,{passive:true});c.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&c.scrollWidth>c.clientWidth){c.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});new ResizeObserver(chNav).observe(c)}
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.dd){ui.dd=ui.dd||{};ui.dd[d.dataset.dd]=d.open}if(d.dataset&&d.dataset.fold){ui.fold=ui.fold||{};ui.fold[d.dataset.fold]=d.open}},true);
let lastDay=today();
setInterval(()=>{const t=today();if(t!==lastDay){lastDay=t;prune();recordHist();render();autoSync()}else head();notiTick()},30000);
backfillBoss();route();setSync('');

initApp();
}
</script></body></html>
